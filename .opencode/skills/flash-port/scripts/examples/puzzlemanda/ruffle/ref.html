<!doctype html>
<!-- The original in Ruffle at 600 x 600 (x2, like the port): ref.html?swf=<ref*.swf of ref_swf.py>, see ruffle_site.sh; window.__log: the state ref_swf.py sends after every frame (rlog) -->
<html><head><meta charset="utf-8"><style>body{margin:8px;background:#2b2b2b} #c{width:600px;height:600px}</style></head>
<body><div id="c"></div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.__log = []; window.rlog = function () { window.__log.push(Array.prototype.slice.call(arguments)); if (window.__log.length > 4000) window.__log.shift() };
window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, contextMenu: 'off', letterbox: 'off', quality: 'best', backgroundColor: '#000000', publicPath: 'ruffle/', allowScriptAccess: true };
</script>
<script src="ruffle/ruffle.js"></script>
<script>
window.addEventListener('load', () => {
  const player = window.RufflePlayer.newest().createPlayer();
  player.style.width = '600px'; player.style.height = '600px';
  document.getElementById('c').appendChild(player);
  window.__player = player;
  player.ruffle().load({ url: (new URLSearchParams(location.search).get('swf') || 'ref.swf'), scale: 'exactfit', quality: 'best' }).then(() => { window.__loaded = true }, (e) => { window.__err = String(e) });
});
</script></body></html>

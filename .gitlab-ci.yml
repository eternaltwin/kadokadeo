stages:
  - update_release

update_staging_via_api:
  stage: update_release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - jq --version
    - |
      CURRENT_CONTENT=$(curl --silent \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fkadokadeo%2Fchannels%2Fstaging.json?ref=main" \
        | jq -r '.content' | base64 -d)
    - NEW_CONTENT=$(echo "$CURRENT_CONTENT" | jq --arg hash "$CI_COMMIT_SHA" '.release = $hash')
    - echo "Updating staging.json with commit $CI_COMMIT_SHA"
    - echo "$NEW_CONTENT" | jq '.'
    - |
      curl --request PUT \
        --header "PRIVATE-TOKEN: ${CONFIG_REPO_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"branch\": \"main\",
          \"content\": $(echo "$NEW_CONTENT" | jq -Rs .),
          \"commit_message\": \"[Kado²] Staging $CI_COMMIT_SHA\"
        }" \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fkadokadeo%2Fchannels%2Fstaging.json"

  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_success

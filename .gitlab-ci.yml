stages:
  - build
  - tag
  - update_release

build-docker:
  timeout: 3h
  image: docker:20.10.16
  stage: build
  services:
    - docker:20.10.16-dind
  tags:
    - saas-linux-large-amd64
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $IMAGE_TAG --build-arg ARCH=x86_64 --build-arg GID=1000 --build-arg UID=1000 --file docker/app/Dockerfile ./
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: manual

tag-docker-latest:
  image: docker:20.10.16
  stage: tag
  services:
    - docker:20.10.16-dind
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE:latest
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME $IMAGE_NAME
    - docker push $IMAGE_NAME
  only:
    - tags


update_staging_via_api:
  stage: update_release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - jq --version
    - |
      CURRENT_CONTENT=$(curl --silent \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fkadokadeo%2Fchannels%2Fstaging.json?ref=main" \
        | jq -r '.content' | base64 -d)
    - NEW_CONTENT=$(echo "$CURRENT_CONTENT" | jq --arg hash "$CI_COMMIT_SHA" '.release = $hash')
    - echo "Updating staging.json with commit $CI_COMMIT_SHA"
    - echo "$NEW_CONTENT" | jq '.'
    - |
      curl --request PUT \
        --header "PRIVATE-TOKEN: ${CONFIG_REPO_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"branch\": \"main\",
          \"content\": $(echo "$NEW_CONTENT" | jq -Rs .),
          \"commit_message\": \"[Kado²] Staging $CI_COMMIT_SHA\"
        }" \
        "https://gitlab.com/api/v4/projects/eternaltwin%2Fconfig/repository/files/pousty%2Fapps%2Fkadokadeo%2Fchannels%2Fstaging.json"
  
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_success
